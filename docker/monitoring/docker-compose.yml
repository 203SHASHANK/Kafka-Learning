# Monitoring Stack: Prometheus + Grafana + JMX Exporter
# =======================================================
# This stack scrapes Kafka's JMX metrics and visualizes them in Grafana.
#
# Metrics you can monitor:
#   - kafka_server_brokertopicmetrics_messagesinpersec  (producer throughput)
#   - kafka_consumer_fetch_manager_records_lag          (consumer lag)
#   - kafka_network_requestmetrics_totaltimems           (request latency)
#
# Start alongside Kafka:
#   make docker-up          # start Kafka first
#   make docker-monitoring  # then start monitoring

services:

  # ── JMX Exporter ─────────────────────────────────────────────────────────
  # Translates Kafka's JMX metrics into Prometheus format.
  jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-exporter
    ports:
      - "5556:5556"
    volumes:
      - ./jmx-exporter-config.yml:/opt/bitnami/jmx-exporter/config.yml:ro
    command: ["5556", "/opt/bitnami/jmx-exporter/config.yml"]

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
